<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple IQ Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #fff;
      padding: 20px 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      text-align: center;
      margin-top: 0;
    }
    .question {
      margin-bottom: 15px;
      font-weight: bold;
    }
    .options {
      list-style: none;
      padding: 0;
      margin-bottom: 20px;
    }
    .options li {
      margin: 6px 0;
    }
    button {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
    }
    .meta {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mini IQ Test</h1>
    <div id="quiz">
      <!-- Question text -->
      <div id="question" class="question"></div>
      <!-- Options -->
      <ul id="options" class="options"></ul>
      <!-- Controls -->
      <button id="nextBtn">Next</button>
    </div>
    <div id="result" class="result"></div>
    <div class="meta">
      This is a simple, non-clinical quiz for fun and practice only.
    </div>
  </div>

  <script>
    // Simple IQ-style questions (logic, patterns, sequences, analogies)
    const questions = [
      {
        text: "1. What comes next in the sequence: 2, 4, 8, 16, ?",
        options: ["18", "24", "32", "36"],
        correctIndex: 2
      },
      {
        text: "2. If all Bloops are Razzies and all Razzies are Lazzies, are all Bloops definitely Lazzies?",
        options: ["Yes", "No"],
        correctIndex: 0
      },
      {
        text: "3. Find the odd one out: 3, 9, 27, 81, 100",
        options: ["3", "9", "27", "100"],
        correctIndex: 3
      },
      {
        text: "4. Which number completes the pattern: 5, 10, 20, 40, ?",
        options: ["45", "60", "80", "100"],
        correctIndex: 2
      },
      {
        text: "5. ANALOGY: Hand is to Glove as Foot is to ____",
        options: ["Sock", "Shoe", "Toe", "Leg"],
        correctIndex: 0
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const nextBtn = document.getElementById("nextBtn");
    const resultEl = document.getElementById("result");

    function loadQuestion() {
      const q = questions[currentQuestion];
      questionEl.textContent = q.text;
      optionsEl.innerHTML = "";

      q.options.forEach((opt, index) => {
        const li = document.createElement("li");
        const label = document.createElement("label");
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "option";
        radio.value = index;

        label.appendChild(radio);
        label.appendChild(document.createTextNode(" " + opt));
        li.appendChild(label);
        optionsEl.appendChild(li);
      });
    }

    function getSelectedOption() {
      const radios = document.querySelectorAll('input[name="option"]');
      for (let r of radios) {
        if (r.checked) return parseInt(r.value, 10);
      }
      return null;
    }

    function showResult() {
      const total = questions.length;
      const percent = Math.round((score / total) * 100);

      let interpretation = "";
      if (percent >= 80) {
        interpretation = "Above average reasoning.";
      } else if (percent >= 60) {
        interpretation = "Average reasoning.";
      } else {
        interpretation = "Below average on this mini test—just practice!";
      }

      resultEl.textContent =
        "You scored " + score + " out of " + total +
        " (" + percent + "%). " + interpretation;

      questionEl.textContent = "";
      optionsEl.innerHTML = "";
      nextBtn.disabled = true;
    }

    nextBtn.addEventListener("click", () => {
      const selected = getSelectedOption();
      if (selected === null) {
        alert("Please select an answer before continuing.");
        return;
      }

      if (selected === questions[currentQuestion].correctIndex) {
        score++;
      }

      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    });

    // Initialize
    loadQuestion();
  </script>
</body>
</html>
